function logo(c){return '<img class="'+c+'" src="'+LOGO+'" alt="Pays Thionvillois Tourisme, Destination Moselle">'}
var root=document.getElementById("gq"),step=0,ans={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function eur(n){return n.toFixed(2).replace(".",",").replace(",00","")+" €"}
function shell(inner){root.innerHTML='<div class="gq-tag"><span class="gq-string"></span>'+inner+'</div>'}
function start(){step=0;ans={};
 shell('<div class="gq-hero"><img src="'+LOGO2+'" alt="Le Comptoir de Noël"></div><div class="gq-candy"></div><h2>Trouvez le cadeau idéal</h2><p>Répondez à 4 questions rapides : on vous propose 3 idées parmi les produits de nos artisans et producteurs locaux.</p><button class="gq-btn" id="gq-go">Commencer</button>'+logo('gq-logo-top'));
 root.querySelector("#gq-go").onclick=ask}
function ask(){var Q=QUESTIONS[step],pct=Math.round(step/QUESTIONS.length*100);
 shell('<div class="gq-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
  '<h2>'+esc(Q.q)+'</h2><div class="gq-opts">'+Q.opts.map(function(o,i){return '<button class="gq-opt" data-i="'+i+'">'+esc(o[0])+'</button>'}).join("")+'</div>'+
  (step?'<button class="gq-ghost" id="gq-back">Question précédente</button>':''));
 root.querySelectorAll(".gq-opt").forEach(function(b){b.onclick=function(){ans[Q.key]=Q.opts[+b.dataset.i][1];step++;step<QUESTIONS.length?ask():result()}});
 var back=root.querySelector("#gq-back");if(back)back.onclick=function(){step--;ask()};
 var f=root.querySelector(".gq-opt");if(f)f.focus()}
/* Le budget est un plafond (« jusqu’à X € ») sauf la dernière tranche. Choix des 3 idées : 1) le public (obligatoire) 2) la catégorie choisie (gourmandise, déco…) 3) le budget : s’il y a trop peu de produits dans la fourchette, on prend les plus proches 4) points pour l’ambiance choisie, tirage aléatoire entre produits proches, producteurs différents si possible */
function pick(){
 var b=ans.budget,note=false;
 var dist=function(p){return p.p<b[0]?b[0]-p.p:p.p>b[1]?p.p-b[1]:0};
 var has=function(p,k){return p.t.indexOf(k)>-1};
 var cand=PRODUCTS.filter(function(p){return p.w.indexOf(ans.who)>-1});
 var byLike=cand.filter(function(p){return has(p,ans.like)});
 if(byLike.length>=3)cand=byLike;
 else{note=true;var alt=cand.filter(function(p){return has(p,ans.like)||has(p,ans.mood)});if(alt.length>=3)cand=alt}
 var pool=cand.filter(function(p){return dist(p)==0});
 if(pool.length<3){note=true;pool=cand.slice().sort(function(x,y){return dist(x)-dist(y)}).slice(0,8)}
 var sc=pool.map(function(p){return{p:p,s:(has(p,ans.like)?3:0)+(has(p,ans.mood)?2:0)+Math.random()*1.5-Math.min(dist(p),60)/20+Math.min(p.p/Math.min(b[1],100),1)}}).sort(function(x,y){return y.s-x.s});
 var out=[],seen={};
 sc.forEach(function(x){var k=x.p.by||x.p.n;if(out.length<3&&!seen[k]){seen[k]=1;out.push(x.p)}});
 sc.forEach(function(x){if(out.length<3&&out.indexOf(x.p)<0)out.push(x.p)});
 note=out.some(function(p){return !has(p,ans.like)||dist(p)>0});
 return{items:out,note:note}}
function result(){
 var r=pick(),alc=r.items.some(function(p){return p.a});
 shell('<div class="gq-bar"><i style="width:100%"></i></div><h2>Nos idées pour vous</h2>'+(r.note?'<p class="gq-note">Peu de produits correspondent exactement à vos critères : voici ce qui s’en rapproche le plus.</p>':'')+
  '<div class="gq-res">'+r.items.map(function(p){return '<div class="gq-item"><div><h3>'+esc(p.n)+'</h3>'+(p.by?'<p class="gq-by">'+esc(p.by)+'</p>':'')+'<p>'+esc(p.d)+'</p><p class="gq-price">'+eur(p.p)+'</p></div></div>'}).join("")+'</div>'+
  '<div class="gq-visit"><img class="gq-logo" src="'+LOGO2+'" alt="Le Comptoir de Noël"><div><h3>Rendez-vous au comptoir de Noël</h3><p>Pays Thionvillois Tourisme<br>31 place Anne Grommerch, Thionville</p></div></div>'+
  (alc?'<p class="gq-alc">L’abus d’alcool est dangereux pour la santé, à consommer avec modération.</p>':'')+
  '<div class="gq-row"><button class="gq-btn" id="gq-more">Voir d’autres idées</button><button class="gq-ghost" id="gq-again">Refaire le quiz</button></div>');
